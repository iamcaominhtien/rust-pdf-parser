name: Release

# Every push to main (each merged PR) is released, without a release PR:
#  - `release` runs `release-plz update`, which picks the next version from the
#    Conventional Commits since the last tag and writes it to Cargo.toml, Cargo.lock
#    and CHANGELOG.md. It commits that to main as `chore: release vX.Y.Z`, then
#    `release-plz release` tags the commit and creates the GitHub release
#    (see release-plz.toml);
#  - `binaries` then attaches prebuilt binaries to the release.
on:
  push:
    branches: [main]

permissions: {}

# One release at a time. A run that waits while another runs releases everything
# merged up to then.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  release:
    name: Tag and release
    # The `chore: release` commit pushed by this job is not released again (pushes
    # made with the default token do not start workflows anyway).
    if: >-
      github.repository_owner == 'iamcaominhtien' &&
      !startsWith(github.event.head_commit.message, 'chore: release')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      created: ${{ steps.release.outputs.created }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      # The tip of main, not the pushed commit: a run that waited for an earlier one
      # starts from that run's `chore: release` commit.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Install release-plz
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: release-plz@0.4.3
      - name: Bump the version and update CHANGELOG.md
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          release-plz update
          # `git status`, not `git diff`: the first release creates CHANGELOG.md.
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing new since the last release"
            exit 0
          fi
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore: release v$version"
          git push origin HEAD:main
      - name: Tag and create the GitHub release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out=$(release-plz release --git-token "$GITHUB_TOKEN" -o json)
          echo "release-plz: $out"
          tag=$(echo "$out" | jq -r '.releases[0].tag // empty')
          if [ -n "$tag" ]; then created=true; else created=false; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "created=$created" >> "$GITHUB_OUTPUT"
          echo "released tag: ${tag:-none}"

  binaries:
    name: Binary ${{ matrix.target }}
    needs: release
    if: needs.release.outputs.created == 'true' && needs.release.outputs.tag != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1.42.0
        with:
          target: ${{ matrix.target }}
      - name: Static C runtime on Windows
        if: endsWith(matrix.target, 'windows-msvc')
        shell: bash
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
      - name: Build and upload
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: paper2html
          target: ${{ matrix.target }}
          locked: true
          include: README.md,LICENSE
          tar: unix
          zip: windows
          checksum: sha256
          ref: refs/tags/${{ needs.release.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
