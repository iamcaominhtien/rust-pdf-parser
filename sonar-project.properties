# SonarQube Cloud analysis, run by .github/workflows/sonar.yml.
# The organization and project key are the defaults SonarQube Cloud gives a GitHub repository
# it imports; change them here if yours differ.
sonar.organization=iamcaominhtien
sonar.projectKey=iamcaominhtien_rust-pdf-parser
sonar.projectName=paper2html

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
# Embedded binary assets (fonts, sound) and test data are not code.
sonar.exclusions=src/render/friendly/fonts/**,src/render/friendly/sounds/**
sonar.test.exclusions=tests/data/**

# Reports made by the workflow before the scan: clippy findings as external issues, and test
# coverage from cargo-llvm-cov.
sonar.rust.clippyReport.reportPaths=clippy-report.json
sonar.rust.lcov.reportPaths=lcov.info
